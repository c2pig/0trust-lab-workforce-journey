name: CI (Typecheck, Test & Build)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "ci-0trust-lab-workforce-journey-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 0trust-lab-workforce-journey
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (Frontend + Server/Functions)
        run: |
          npx tsc --noEmit
          npx tsc -p tsconfig.server.json --noEmit

      - name: Run unit & security tests
        run: npm test

      - name: Build production bundles
        run: npm run build

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform Format Check
        run: terraform -chdir=infra/terraform fmt -check

      - name: Verify Immutable Module Pinning & GCS Backend
        run: |
          if grep -q '?ref=main' infra/terraform/main.tf; then
            echo "::error::Mutable ?ref=main module reference found in infra/terraform/main.tf"
            exit 1
          fi
          grep -q 'backend "gcs"' infra/terraform/backend.tf

      - name: Terraform Init & Validate
        env:
          MANAGED_INFRA_READ_TOKEN: ${{ secrets.MANAGED_INFRA_READ_TOKEN }}
        run: |
          if [ -n "$MANAGED_INFRA_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${MANAGED_INFRA_READ_TOKEN}@github.com/c2pig/managed-infrastructure.git".insteadOf "https://github.com/c2pig/managed-infrastructure.git"
            terraform -chdir=infra/terraform init -backend=false -input=false
            terraform -chdir=infra/terraform validate
          else
            echo "::notice::MANAGED_INFRA_READ_TOKEN is not set; skipping private module download for c2pig/managed-infrastructure. Add a fine-grained contents:read PAT secret to enable full terraform validate in CI."
          fi
