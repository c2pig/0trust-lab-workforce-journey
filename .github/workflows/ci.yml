name: CI (Typecheck, Test & Build)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "ci-0trust-lab-workforce-journey-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 0trust-lab-workforce-journey
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (Frontend + Server/Functions)
        run: |
          npx tsc --noEmit
          npx tsc -p tsconfig.server.json --noEmit

      - name: Run unit & security tests
        run: npm test

      - name: Build production bundles
        run: npm run build

  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout 0trust-lab-workforce-journey
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform Format Check
        run: terraform -chdir=infra/terraform fmt -check

      - name: Terraform Init (No Backend)
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform -chdir=infra/terraform validate
