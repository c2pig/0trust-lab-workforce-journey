name: Sync Contract & Diagrams to Hub

on:
  push:
    branches: [main]
    paths:
      - 'lab.manifest.json'
      - 'docs/diagrams/*.svg'
  workflow_dispatch:

jobs:
  dispatch-to-hub:
    name: Notify c2pig/0trust.dev (repository_dispatch)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed contract/diagram files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=lab.manifest.json" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- lab.manifest.json 'docs/diagrams/*.svg' | tr '\n' ',' | sed 's/,$//')
            echo "files=${CHANGED:-lab.manifest.json}" >> "$GITHUB_OUTPUT"
          fi
          LAB_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('lab.manifest.json','utf8')).id)")
          echo "lab_id=$LAB_ID" >> "$GITHUB_OUTPUT"

      - name: Fire repository_dispatch to c2pig/0trust.dev
        env:
          HUB_DISPATCH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$HUB_DISPATCH_TOKEN" ]; then
            echo "::warning::HUB_DISPATCH_TOKEN secret is not configured; skipping cross-repo repository_dispatch to c2pig/0trust.dev."
            exit 0
          fi

          export LAB_ID="${{ steps.changes.outputs.lab_id }}"
          export CHANGED_FILES="${{ steps.changes.outputs.files }}"
          PAYLOAD=$(node -e '
            console.log(JSON.stringify({
              event_type: "lab_contract_updated",
              client_payload: {
                repo: process.env.GITHUB_REPOSITORY,
                sha: process.env.GITHUB_SHA,
                ref: process.env.GITHUB_REF,
                lab_id: process.env.LAB_ID,
                changed_files: process.env.CHANGED_FILES
              }
            }));
          ')

          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HUB_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/c2pig/0trust.dev/dispatches" \
            -d "$PAYLOAD"

          echo "Dispatched lab_contract_updated for $GITHUB_REPOSITORY ($LAB_ID)."
