  <rect x="40" y="86" width="1120" height="178" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
  <rect x="60" y="102" width="415" height="24" rx="5" fill="#ecfdf5" />
  <text x="72" y="118" fill="#047857" font-size="11.5" font-weight="700" letter-spacing="0.5">TOP · EXPERIENCE LAYER (ARCHETYPE A · 3-SEAT ROLE-PLAY)</text>
  <rect x="810" y="102" width="330" height="24" rx="5" fill="#f1f5f9" />
  <text x="975" y="118" fill="#334155" font-size="10.5" font-weight="600" font-family="monospace" text-anchor="middle">RoleSwitcherBar.tsx · Sandbox | Entra</text>

  <!-- E1 -->
  <rect x="60" y="140" width="316" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="74" y="152" width="58" height="20" rx="4" fill="#dbeafe" />
  <text x="103" y="166" fill="#1d4ed8" font-size="10.5" font-weight="700" text-anchor="middle">SEAT 1</text>
  <text x="142" y="166" fill="#0f172a" font-size="13.5" font-weight="700">Maya Lin · Finance Ops</text>
  <text x="74" y="190" fill="#475569" font-size="12">FinCore Treasury ERP &amp; Access Hub:</text>
  <text x="74" y="208" fill="#475569" font-size="12">Hits HTTP 403, tests SoD/ZSP traps,</text>
  <text x="74" y="226" fill="#059669" font-size="12" font-weight="600">submits 15m JIT request (PENDING).</text>

