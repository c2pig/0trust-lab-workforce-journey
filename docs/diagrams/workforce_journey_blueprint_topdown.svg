  <text x="789" y="209" fill="#047857" font-size="10" font-weight="700" text-anchor="middle">jit_jwt</text>

  <!-- E3 -->
  <rect x="824" y="140" width="316" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="838" y="152" width="58" height="20" rx="4" fill="#dbeafe" />
  <text x="867" y="166" fill="#1d4ed8" font-size="10.5" font-weight="700" text-anchor="middle">SEAT 3</text>
  <text x="906" y="166" fill="#0f172a" font-size="13.5" font-weight="700">Priya Nair · SecOps Admin</text>
