  <rect x="442" y="660" width="320" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="458" y="684" fill="#0f172a" font-size="13" font-weight="700">XRayTelemetryDrawer.tsx</text>
  <text x="458" y="704" fill="#475569" font-size="11.5">Sticky-bottom drawer inside Lab 1:</text>
  <text x="458" y="720" fill="#475569" font-size="11.5">Security Audit Feed &amp; Live Decoded Proof.</text>

  <!-- Dotted Arrow O2 -> O3 -->
  <line x1="762" y1="696" x2="820" y2="696" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-amber)" />

  <!-- O3 -->
  <rect x="824" y="660" width="316" height="72" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2" />
  <text x="840" y="684" fill="#92400e" font-size="13" font-weight="700">Grafana Cloud / New Relic</text>
  <text x="840" y="704" fill="#92400e" font-size="11.5">Async OTLP/HTTP export via waitUntil()</text>
  <text x="840" y="720" fill="#92400e" font-size="11.5">(0ms user delay · Free Forever Tier).</text>
