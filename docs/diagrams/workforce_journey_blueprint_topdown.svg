  <text x="76" y="442" fill="#475569" font-size="12">(&lt;=900s); queues PENDING in KV.</text>

  <!-- P2 -->
  <rect x="442" y="378" width="316" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="458" y="402" fill="#0f172a" font-size="13.5" font-weight="700">2-Step JIT Approval Authority</text>
  <text x="458" y="424" fill="#475569" font-size="12">Blocks grant_permanent (403 ZSP);</text>
  <text x="458" y="442" fill="#475569" font-size="12">on approve mints 15m jit_jwt (+900s).</text>

  <!-- P3 -->
  <rect x="824" y="378" width="316" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
