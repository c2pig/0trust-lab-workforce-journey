  <!-- O1 -->
  <rect x="60" y="660" width="320" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="76" y="684" fill="#0f172a" font-size="13" font-weight="700">Trace &amp; Secret Redactor</text>
  <text x="76" y="704" fill="#475569" font-size="11.5">W3C traceparent, server latency (ms),</text>
  <text x="76" y="720" fill="#475569" font-size="11.5">&amp; automatic token/PII masking.</text>

  <!-- Arrow O1 -> O2 -->
  <line x1="380" y1="696" x2="438" y2="696" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)" />

