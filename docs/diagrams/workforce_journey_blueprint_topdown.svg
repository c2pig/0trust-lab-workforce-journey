  <line x1="376" y1="192" x2="438" y2="192" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <text x="407" y="182" fill="#047857" font-size="10" font-weight="700" text-anchor="middle">#REQ</text>
  <text x="407" y="209" fill="#047857" font-size="10" font-weight="700" text-anchor="middle">Pending</text>

  <!-- E2 -->
  <rect x="442" y="140" width="316" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="456" y="152" width="58" height="20" rx="4" fill="#dbeafe" />
  <text x="485" y="166" fill="#1d4ed8" font-size="10.5" font-weight="700" text-anchor="middle">SEAT 2</text>
  <text x="524" y="166" fill="#0f172a" font-size="13.5" font-weight="700">Marcus Chen · Finance Mgr</text>
  <text x="456" y="190" fill="#475569" font-size="12">AccessGuard Approval Inbox:</text>
  <text x="456" y="208" fill="#475569" font-size="12">Blocks Grant Permanent (403 ZSP),</text>
  <text x="456" y="226" fill="#059669" font-size="12" font-weight="600">approves &amp; mints 15m jit_jwt (+900s).</text>

