  <text x="40" y="64" fill="#64748b" font-size="13">Top = 3-Seat Empathic Role-Play (/workforce-journey)  ·  Middle = Platform &amp; IdP Capability  ·  Bottom = Shared Observability Layer</text>

  <!-- ====================================================================== -->
