  <rect x="82" y="278" width="272" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="218" y="293" fill="#1e40af" font-size="10" font-weight="600" font-family="monospace" text-anchor="middle">POST /login-provision &amp; /jit-submit</text>

  <line x1="600" y1="264" x2="600" y2="322" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="464" y="278" width="272" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="600" y="293" fill="#1e40af" font-size="10" font-weight="600" font-family="monospace" text-anchor="middle">POST /jit-decision (approve | deny)</text>

  <line x1="982" y1="264" x2="982" y2="322" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
