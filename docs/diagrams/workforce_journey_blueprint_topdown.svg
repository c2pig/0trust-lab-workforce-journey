  <line x1="600" y1="462" x2="600" y2="486" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-slate)" />
  <line x1="982" y1="462" x2="982" y2="486" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-slate)" />

